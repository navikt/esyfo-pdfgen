apiVersion: nais.io/v1alpha1
kind: Application
metadata:
  name: esyfo-pdfgen
  namespace: team-esyfo
  labels:
    team: team-esyfo
spec:
  image: {{ image }}
  port: 8080
  replicas:
    min: 1
    max: 1
  liveness:
    path: /internal/is_alive
  readiness:
    path: /internal/is_ready
  prometheus:
    path: /internal/metrics
  observability:
    autoInstrumentation:
      enabled: true
      runtime: sdk
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 2Gi
  accessPolicy:
    inbound:
      rules:
        - application: syfo-oppfolgingsplan-backend
        - application: meroppfolging-backend
        - application: ismeroppfolging
          namespace: teamsykefravr
        - application: syfooppfolgingsplanservice
          namespace: team-esyfo
          cluster: dev-fss
        - application: lps-oppfolgingsplan-mottak
          namespace: team-esyfo
