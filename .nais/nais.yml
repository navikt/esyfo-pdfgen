apiVersion: nais.io/v1alpha1
kind: Application
metadata:
  name: esyfo-pdfgen
  namespace: team-esyfo
  labels:
    team: team-esyfo
spec:
  port: 8080
  replicas:
    min: 1
    max: 1
  liveness:
    path: /internal/is_alive
    timeout: 1
    initialDelay: 5
    periodSeconds: 5
    failureThreshold: 30
  readiness:
    path: /internal/is_ready
    timeout: 1
    initialDelay: 5
    periodSeconds: 5
    failureThreshold: 30
  prometheus:
    path: /internal/metrics
  observability:
    autoInstrumentation:
      enabled: true
      runtime: sdk
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 2Gi
