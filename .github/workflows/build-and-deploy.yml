name: Build & Deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
  merge_group:
    types: [checks_requested]

jobs:
  test-templates:
    name: Test PDF templates
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
      - name: Compile all templates
        run: scripts/test-templates.sh

  build:
    name: Build
    if: >-
      ${{
        github.actor != 'dependabot[bot]' &&
        (
          github.event_name == 'pull_request' ||
          github.event_name == 'merge_group' ||
          github.event_name == 'push'
        )
      }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
      # Merge queue refs make the OIDC sub claim exceed GCP's 127-byte limit, so only verify the build there.
      - name: Build docker image (merge queue)
        if: ${{ github.event_name == 'merge_group' }}
        run: docker build --target production .
      - name: Build and push docker image
        if: ${{ github.event_name != 'merge_group' }}
        uses: nais/docker-build-push@423a915c9b72edf2ba848b88171ccb0489e2a40a # v0
        id: docker-build-push
        with:
          team: team-esyfo
          identity_provider: ${{ secrets.NAIS_WORKLOAD_IDENTITY_PROVIDER }}
          project_id: ${{ vars.NAIS_MANAGEMENT_PROJECT_ID }}
          target: production
    outputs:
      image: ${{ steps.docker-build-push.outputs.image }}

  build-demo:
    name: Build demo
    if: ${{ github.event_name == 'push' }}
    needs: test-templates
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
      - name: Build and push demo image
        id: docker-build-push
        uses: nais/docker-build-push@423a915c9b72edf2ba848b88171ccb0489e2a40a # v0
        with:
          team: team-esyfo
          identity_provider: ${{ secrets.NAIS_WORKLOAD_IDENTITY_PROVIDER }}
          project_id: ${{ vars.NAIS_MANAGEMENT_PROJECT_ID }}
          image_suffix: demo
          target: development
      - name: Build and push demo web image
        id: docker-build-push-web
        uses: nais/docker-build-push@423a915c9b72edf2ba848b88171ccb0489e2a40a # v0
        with:
          team: team-esyfo
          identity_provider: ${{ secrets.NAIS_WORKLOAD_IDENTITY_PROVIDER }}
          project_id: ${{ vars.NAIS_MANAGEMENT_PROJECT_ID }}
          dockerfile: demo/Dockerfile
          docker_context: .
          image_suffix: demo-web
    outputs:
      image: ${{ steps.docker-build-push.outputs.image }}
      web_image: ${{ steps.docker-build-push-web.outputs.image }}

  deploy-dev:
    name: Deploy to dev
    if: >-
      ${{
        github.event_name == 'pull_request' ||
        github.event_name == 'push'
      }}
    needs: [build, test-templates]
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-dev-gcp
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    environment: dev
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
      - name: Set up Nais CLI
        uses: nais/setup@ea33c90b68228e6f04fb34b88bfd8ab6ad523ce8 # v1.0.2
        with:
          team: team-esyfo
      - name: Deploy to dev-gcp
        env:
          IMAGE: ${{ needs.build.outputs.image }}
        run: nais apply .nais/nais.yml --environment dev-gcp --set spec.image="$IMAGE" --wait

  deploy-prod:
    name: Deploy to prod
    if: ${{ github.event_name == 'push' }}
    needs: [build, test-templates, deploy-dev]
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-prod-gcp
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    environment: prod
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
      - name: Set up Nais CLI
        uses: nais/setup@ea33c90b68228e6f04fb34b88bfd8ab6ad523ce8 # v1.0.2
        with:
          team: team-esyfo
      - name: Deploy to prod-gcp
        env:
          IMAGE: ${{ needs.build.outputs.image }}
        run: nais apply .nais/nais.yml --environment prod-gcp --set spec.image="$IMAGE" --wait

  deploy-demo:
    name: Deploy to demo
    if: ${{ github.event_name == 'push' }}
    needs: [build-demo, deploy-prod]
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-demo-gcp
      cancel-in-progress: true
    permissions:
      contents: read
      id-token: write
    environment:
      name: demo
      url: https://esyfo-pdfgen-demo.ekstern.dev.nav.no
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
      - name: Set up Nais CLI
        uses: nais/setup@ea33c90b68228e6f04fb34b88bfd8ab6ad523ce8 # v1.0.2
        with:
          team: team-esyfo
      - name: Deploy demo pdfgen to dev-gcp
        env:
          IMAGE: ${{ needs.build-demo.outputs.image }}
        run: nais apply .nais/nais.yml --environment dev-gcp --mixin .nais/demo/pdfgen.yml --set spec.image="$IMAGE" --wait
      - name: Deploy demo web to dev-gcp
        env:
          IMAGE: ${{ needs.build-demo.outputs.web_image }}
        run: nais apply .nais/demo/web.yml --environment dev-gcp --set spec.image="$IMAGE" --wait