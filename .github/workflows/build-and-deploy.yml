name: Build & Deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

jobs:
  test-templates:
    name: Test PDF templates
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
      - name: Compile all templates
        run: scripts/test-templates.sh

  build:
    name: Build
    if: ${{ github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
      # Merge queue refs make the OIDC sub claim exceed GCP's 127-byte limit, so only verify the build there.
      - name: Build docker image (merge queue)
        if: ${{ github.event_name == 'merge_group' }}
        run: docker build --target production .
      - name: Build and push docker image
        if: ${{ github.event_name != 'merge_group' }}
        uses: nais/docker-build-push@ceabe305c64640175f133b7e59af6666b0a3c46c # v0
        id: docker-build-push
        with:
          team: team-esyfo
          identity_provider: ${{ secrets.NAIS_WORKLOAD_IDENTITY_PROVIDER }}
          project_id: ${{ vars.NAIS_MANAGEMENT_PROJECT_ID }}
          target: production
    outputs:
      image: ${{ steps.docker-build-push.outputs.image }}

  deploy-dev:
    name: Deploy to dev
    if: ${{ github.event_name == 'pull_request' || github.ref == 'refs/heads/main' }}
    needs: [build, test-templates]
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-dev-gcp
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    environment: dev
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
      - name: Set up Nais CLI
        uses: nais/setup@fb8692f65df9c904e2cdac5d395630ac876abdcf # v1.0.3
        with:
          team: team-esyfo
      - name: Deploy to dev-gcp
        env:
          IMAGE: ${{ needs.build.outputs.image }}
        run: nais apply .nais/nais.yml --environment dev-gcp --set spec.image="$IMAGE" --wait

  deploy-prod:
    name: Deploy to prod
    if: ${{ github.ref == 'refs/heads/main' }}
    needs: [build, test-templates]
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-prod-gcp
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    environment: prod
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
      - name: Set up Nais CLI
        uses: nais/setup@fb8692f65df9c904e2cdac5d395630ac876abdcf # v1.0.3
        with:
          team: team-esyfo
      - name: Deploy to prod-gcp
        env:
          IMAGE: ${{ needs.build.outputs.image }}
        run: nais apply .nais/nais.yml --environment prod-gcp --set spec.image="$IMAGE" --wait

  demo:
    name: Demo
    if: ${{ github.ref == 'refs/heads/main' }}
    needs: test-templates
    uses: ./.github/workflows/deploy-demo.yml
    permissions:
      contents: read
      id-token: write
      packages: write
    secrets: inherit
