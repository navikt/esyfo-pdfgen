name: Deploy demo

on:
  workflow_dispatch:

jobs:
  build:
    name: Build demo
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
      - name: Build and push demo image
        id: docker-build-push
        uses: nais/docker-build-push@v0
        with:
          team: team-esyfo
          identity_provider: ${{ secrets.NAIS_WORKLOAD_IDENTITY_PROVIDER }}
          project_id: ${{ vars.NAIS_MANAGEMENT_PROJECT_ID }}
          image_suffix: demo
          target: development
      - name: Build and push demo web image
        id: docker-build-push-web
        uses: nais/docker-build-push@v0
        with:
          team: team-esyfo
          identity_provider: ${{ secrets.NAIS_WORKLOAD_IDENTITY_PROVIDER }}
          project_id: ${{ vars.NAIS_MANAGEMENT_PROJECT_ID }}
          dockerfile: demo/Dockerfile
          docker_context: .
          image_suffix: demo-web
    outputs:
      image: ${{ steps.docker-build-push.outputs.image }}
      web_image: ${{ steps.docker-build-push-web.outputs.image }}

  deploy:
    name: Deploy to demo
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-demo-gcp
      cancel-in-progress: true
    permissions:
      id-token: write
    environment:
      name: demo
      url: https://esyfo-pdfgen-demo.intern.dev.nav.no
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
      - name: Deploy demo pdfgen to dev-gcp
        uses: nais/deploy/actions/deploy@v2
        env:
          CLUSTER: dev-gcp
          RESOURCE: .nais/nais-demo.yml
          VAR: image=${{ needs.build.outputs.image }}
      - name: Deploy demo web to dev-gcp
        uses: nais/deploy/actions/deploy@v2
        env:
          CLUSTER: dev-gcp
          RESOURCE: .nais/nais-demo-web.yml
          VAR: image=${{ needs.build.outputs.web_image }}
