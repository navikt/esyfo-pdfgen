[tasks.build]
description = "Bygg de lokale imagene for API og demoside"
run = "docker compose build"

[tasks.dev]
description = "Start API og demoside lokalt, og bygg på nytt ved endringer i maler, lib, data og demo"
run = """
docker compose up --build --watch
echo "Demoside: http://localhost:9090/"
echo "API:      http://localhost:9091/api/v1/genpdf/<område>/<dokument>"
"""

[tasks.stop]
description = "Stop lokal esyfo-pdfgen"
run = "docker compose down"

[tasks.test]
description = "Kompiler alle eksempeldata mot malene og sjekk at de gir gyldig PDF"
run = "scripts/test-templates.sh"
