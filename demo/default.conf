upstream pdfgen {
    include /etc/nginx/pdfgen-upstream.conf;
}

server {
    listen 8080;
    server_tokens off;
    root /usr/share/nginx/html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; frame-src 'self'; object-src 'self'; frame-ancestors 'self'; base-uri 'none'; form-action 'none'" always;

    location = / {
        try_files /index.html =404;
    }

    location = /app.js {
        try_files /app.js =404;
    }

    location = /style.css {
        try_files /style.css =404;
    }

    location = /internal/is_alive {
        default_type text/plain;
        return 200 'ok';
    }

    location = /internal/is_ready {
        default_type text/plain;
        return 200 'ok';
    }

    location /api/ {
        client_max_body_size 2m;
        proxy_read_timeout 60s;
        # Override page headers so PDF responses do not get the page CSP.
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "frame-ancestors 'self'" always;
        proxy_set_header Host $host;
        proxy_set_header Authorization "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://pdfgen;
    }

    location / {
        return 404;
    }
}
